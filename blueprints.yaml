name: Umami Analytics
slug: umami-analytics
type: plugin
version: 2.0.0
description: Grav plugin for adding Umami Analytics to your site
icon: bar-chart
author:
  name: Crabston GmbH
  email: contact@crabston.dev
  url: https://crabston.dev
homepage: https://github.com/Crabston/grav-plugin-umami-analytics
demo: https://grav.demo.crabston.dev
keywords: grav, plugin, analytics, umami
bugs: https://github.com/Crabston/grav-plugin-umami-analytics/issues
docs: https://github.com/Crabston/grav-plugin-umami-analytics/blob/main/README.md
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: loose
  fields:

    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    script_src:
      type: url
      size: medium
      label: PLUGIN_UMAMI_ANALYTICS.SCRIPT_SRC.LABEL
      description: PLUGIN_UMAMI_ANALYTICS.SCRIPT_SRC.DESCRIPTION
      placeholder: 'https://us.umami.is'
      default: 'https://us.umami.is'
      validate:
        required: true
        #pattern: ''

    website_id:
      type: text
      size: medium
      label: PLUGIN_UMAMI_ANALYTICS.WEBSITE_ID.LABEL
      description: PLUGIN_UMAMI_ANALYTICS.WEBSITE_ID.DESCRIPTION
      placeholder: '76e4f3db-8fec-47ad-82ba-f5O21cOac915'
      validate:
        required: true
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

    share_id:
      type: text
      size: medium
      label: PLUGIN_UMAMI_ANALYTICS.SHARE_ID.LABEL
      description: PLUGIN_UMAMI_ANALYTICS.SHARE_ID.DESCRIPTION
      placeholder: PLUGIN_UMAMI_ANALYTICS.SHARE_ID.PLACEHOLDER
      validate:
        pattern: '^[A-Za-z0-9_-]+$'

    disable_auto_track:
      type: toggle
      label: PLUGIN_UMAMI_ANALYTICS.DISABLE_AUTO_TRACK.LABEL
      help: PLUGIN_UMAMI_ANALYTICS.DISABLE_AUTO_TRACK.HELP
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.DISABLED
        0: PLUGIN_ADMIN.ENABLED
      validate:
        type: bool

    domains:
      type: text
      size: large
      label: PLUGIN_UMAMI_ANALYTICS.DOMAINS.LABEL
      help: PLUGIN_UMAMI_ANALYTICS.DOMAINS.HELP
      placeholder: 'example.com,your-domain.tld'

    enable_localhost:
      type: toggle
      label: PLUGIN_UMAMI_ANALYTICS.ENABLE_LOCALHOST.LABEL
      description: PLUGIN_UMAMI_ANALYTICS.ENABLE_LOCALHOST.DESCRIPTION
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    doNotTrack:
      type: toggle
      label: PLUGIN_UMAMI_ANALYTICS.DONOTTRACK.LABEL
      help: PLUGIN_UMAMI_ANALYTICS.DONOTTRACK.HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    performance:
      type: toggle
      label: PLUGIN_UMAMI_ANALYTICS.PERFORMANCE.LABEL
      help: PLUGIN_UMAMI_ANALYTICS.PERFORMANCE.HELP
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    recorder:
      type: toggle
      label: PLUGIN_UMAMI_ANALYTICS.RECORDER.LABEL
      help: PLUGIN_UMAMI_ANALYTICS.RECORDER.HELP
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    proxy:
      type: section
      style: vertical
      title: PLUGIN_UMAMI_ANALYTICS.PROXY.TITLE
      text: PLUGIN_UMAMI_ANALYTICS.PROXY.TEXT
      fields:
        enable:
          type: toggle
          label: PLUGIN_UMAMI_ANALYTICS.PROXY.ENABLE.LABEL
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        script_path:
          type: text
          size: medium
          label: PLUGIN_UMAMI_ANALYTICS.PROXY.SCRIPT_PATH.LABEL
          default: stats.js
          validate:
            pattern: '^[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*\.js$'

        api_endpoint:
          type: text
          size: medium
          label: PLUGIN_UMAMI_ANALYTICS.PROXY.API_ENDPOINT.LABEL
          default: /stats-api/
          validate:
            pattern: '^/[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*/?$'

        cache_ttl:
          type: number
          size: small
          label: PLUGIN_UMAMI_ANALYTICS.PROXY.CACHE_TTL.LABEL
          help: PLUGIN_UMAMI_ANALYTICS.PROXY.CACHE_TTL.HELP
          default: 3600
          validate:
            type: int
            min: 0
